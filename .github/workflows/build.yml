name: Build mod jar
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Build (retries if a download server is busy)
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew build --no-daemon && exit 0
            echo "Build attempt $attempt failed - waiting before retrying..."
            sleep $((attempt * 45))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: vaporous-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
